name: Route Radar CI Pipeline

on:
  push:
    branches: [ main, "feat/**", "phase-**" ]
  pull_request:
    branches: [ main ]

jobs:
  backend-test:
    name: Backend Lint & Pytest Suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Backend Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run Ruff Linter
        run: python -m ruff check backend/

      - name: Run Pytest Suite (122 Tests)
        run: python -m pytest backend/ --verbose

  frontend-test:
    name: Frontend Vitest & Build Verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package.json

      - name: Install Frontend Dependencies
        run: npm --prefix frontend install

      - name: Run Vitest Suite (17 Tests)
        run: npm --prefix frontend test

      - name: Verify Production Build
        run: npm --prefix frontend run build

  single-service-verify:
    name: Single-Service WhiteNoise Integration
    needs: [backend-test, frontend-test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build Frontend & Collect Static Assets
        run: |
          npm --prefix frontend install
          npm --prefix frontend run build
          pip install -r backend/requirements.txt
          python backend/manage.py collectstatic --noinput

      - name: Smoke Test Backend App
        run: python backend/manage.py check --deploy
        env:
          DJANGO_SECRET_KEY: "ci-secret-key-test"
          DJANGO_DEBUG: "False"
          DJANGO_ALLOWED_HOSTS: "localhost,127.0.0.1"
